name: Super_Employee

on:
  # 每天北京时间上午 10:00 自动触发
  schedule:
    - cron: '0 10 * * *'
      timezone: 'Asia/Shanghai'

  # 保留手动运行入口
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify scheduled execution
        run: |
          echo "Super_Employee workflow started"
          echo "Timezone: Asia/Shanghai"
          echo "Schedule: Every day at 10:00"
          python --version
          echo "Workflow configuration is working"
